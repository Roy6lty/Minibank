services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-minibank}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:1.18
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    command:
      - server
      - -dev
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    command:
      - kv
      - put
      - secret/${VAULT_SECRET_PATH:-minibank}
      - DB_PASSWORD=${DB_PASSWORD:-change-me}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ACCESS_SECRET=${ACCESS_SECRET:-dev-access-secret-change-me}
      - REFRESH_SECRET=${REFRESH_SECRET:-dev-refresh-secret-change-me}

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -dir
      - /app/database/migrations
      - postgres
      - "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-change-me}@postgres:5432/${DB_NAME:-minibank}?sslmode=disable"
      - up

  minibank:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-minibank}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-10s}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-30m}
      DB_HEALTH_CHECK_PERIOD: ${DB_HEALTH_CHECK_PERIOD:-1m}
      REDIS_ADDR: redis:6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-5s}
      REDIS_READ_TIMEOUT: ${REDIS_READ_TIMEOUT:-3s}
      REDIS_WRITE_TIMEOUT: ${REDIS_WRITE_TIMEOUT:-3s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      RECONCILIATION_INTERVAL: ${RECONCILIATION_INTERVAL:-1h}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-1m}
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_SECRET_PATH: ${VAULT_SECRET_PATH:-minibank}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
