version: "2"

sql:
  - engine: "postgresql"
    schema: "database/migrations"
    queries: "database/query"
    gen:
      go:
        package: "database"
        out: "internal/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
